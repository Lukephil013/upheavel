<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upheavel</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head>
<body><aside><div class="brand">Upheavel</div><div class="side-label">PROJECTS</div><nav aria-label="Projects and subsections" id="categories"></nav><button id="new-project">＋ Add project</button><button id="manage-projects">Manage projects</button><div class="backup"><button id="export">Export backup</button><button id="import">Import backup</button><input type="file" id="file" accept="application/json,.json" hidden></div></aside>
<main><header><div><div class="eyebrow" id="project-name">Korean</div><h1>Learning board</h1></div><button class="primary" id="add">＋ Add item</button></header><div class="tools"><label class="search"><span>Search</span><input id="search" placeholder="Find an item"></label><span id="saved" role="status">Saved in this browser</span></div><p id="error" role="alert" hidden></p><p id="study-message" role="status" hidden></p><div id="board"></div><div id="undo" hidden><span>Item removed.</span><button id="restore">Undo</button></div></main>
<dialog id="notebook" aria-labelledby="dialog-title"><form id="editor"><div class="dialog-heading"><h2 id="dialog-title">Item</h2><button type="button" id="close" aria-label="Close notebook">×</button></div><label>Title<input id="title" maxlength="160" required></label><div class="fields"><label>Section<select id="status"></select></label><label>Subsection<select id="category"></select></label></div><label>Notes<textarea id="notes" maxlength="200000" placeholder="Examples, questions, or what you understand so far."></textarea></label><div class="link-heading"><h3>Links</h3><button type="button" id="add-link">＋ Add link</button></div><div id="links"></div><div class="dialog-footer"><span id="note-status" role="status"></span><div><button type="button" id="export-draft">Export backup</button><button type="button" id="remove">Remove item</button><button class="primary" type="submit" id="done">Done</button></div></div></form></dialog><dialog id="project-dialog" aria-labelledby="project-dialog-title"><div class="dialog-heading"><h2 id="project-dialog-title">Manage projects</h2><button id="close-projects" aria-label="Close project settings">×</button></div><div id="project-settings"></div><p id="project-error" role="alert"></p></dialog></body></html>
